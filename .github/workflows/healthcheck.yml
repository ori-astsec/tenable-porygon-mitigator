name: Source healthcheck

# Weekly: are the advisory APIs, page templates and rule catalogues still reachable and parseable?
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  healthcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install
        run: uv sync --locked
      - name: Check sources
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: uv run python scripts/healthcheck.py
