# Gold labels for `porygon tag`, written by hand from each CVE's public advisory and record (CVE.org, NVD, vendor
# bulletin). Nothing here comes from a scanner's or anyone else's classification.
#
# class:      every acceptable answer. Two are listed where the public record supports both (an SMB driver flaw is a
#             listening service and kernel code). Leaving the class empty is never wrong, only less useful.
# processes:  any one of these counts as naming the right process (lower case; `.exe` optional when grading).
# protocols:  any one of these counts as naming the right protocol.
# split:      train cases may shape the prompt; test cases are only scored at the end.

cases:
  # Listening services
  - {cve: CVE-2020-1350, split: train, class: [server], processes: [dns.exe], protocols: [dns]}
  - {cve: CVE-2019-0708, split: test, class: [server], processes: [svchost.exe, termdd.sys, termsrv.dll], protocols: [rdp]}
