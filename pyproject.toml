[project]
name = "porygon-mitigator"
version = "0.1.0"
description = "Find verified, machine-specific compensating controls for a CVE when you can't patch yet. MCP server, CLI and Claude Code skill."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Team Porygon contributors" }]
requires-python = ">=3.11"
keywords = ["cve", "mitigation", "compensating-controls", "vulnerability-management", "mcp", "claude"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Environment :: Console",
]
dependencies = [
    "anthropic>=2.4.0",
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "pydantic>=2.14.2",
]

[project.scripts]
porygon = "porygon_mitigator.cli:main"
porygon-mcp = "porygon_mitigator.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/porygon_mitigator"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests", "evals"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PTH", "ASYNC"]
ignore = [
    "S101",   # assert is fine in tests and invariants
    "RUF001", # we deliberately normalise unicode punctuation in advisory text
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PTH"]
"evals/**" = ["S311"]
"src/porygon_mitigator/extract/prompts.py" = ["E501"]
"scripts/build_visuals.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
packages = ["porygon_mitigator"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["bs4.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not live'"
markers = [
    "live: calls real network services or the Claude API (needs ANTHROPIC_API_KEY); excluded by default",
]

[dependency-groups]
dev = [
    "anthropic[bedrock]>=2.4.0",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pyyaml>=6.0.3",
    "respx>=0.23.1",
    "ruff>=0.17.3",
    "types-pyyaml>=6.0.12.20261030",
]
